<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>R.E.L.A.Y. — Junction Sim</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0d10; }
    #app { width: 100vw; height: 100vh; display: block; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
      color: #e8eaed; text-shadow: 0 1px 3px rgba(0,0,0,.8);
      background: rgba(12,14,18,.55); padding: 10px 12px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.08); min-width: 190px;
    }
    #hud h1 { font-size: 13px; letter-spacing: .06em; color: #7dd3fc; margin-bottom: 6px; }
    #hud .row { display: flex; justify-content: space-between; gap: 16px; }
    #hud .phase { color: #86efac; }
    #hud .k { color: #9aa0a6; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="hud">
    <h1>R.E.L.A.Y. · junction sim</h1>
    <div class="row"><span class="k">phase</span><span id="h-phase" class="phase">—</span></div>
    <div class="row"><span class="k">north</span><span id="h-N">0</span></div>
    <div class="row"><span class="k">south</span><span id="h-S">0</span></div>
    <div class="row"><span class="k">east</span><span id="h-E">0</span></div>
    <div class="row"><span class="k">west</span><span id="h-W">0</span></div>
    <div class="row"><span class="k">cars</span><span id="h-total">0</span></div>
  </div>

  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
