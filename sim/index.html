<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%A6%3C/text%3E%3C/svg%3E" />
  <title>R.E.L.A.Y. — Junction Sim</title>
  <style>
    :root{
      --bg:#0b0d10; --panel:rgba(16,19,24,.72); --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
      --txt:#e8eaed; --muted:#9aa0a6; --cy:#7dd3fc; --grn:#86efac; --red:#ff6b62; --amb:#ffcc00;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg);
      font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    #app { width: 100vw; height: 100vh; display: block; }

    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 10; width: 216px;
      color: var(--txt); text-shadow: 0 1px 2px rgba(0,0,0,.6);
      background: var(--panel); backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
      padding: 13px 14px; border-radius: 11px; border: 1px solid var(--line);
      box-shadow: 0 6px 22px rgba(0,0,0,.35);
    }
    #hud h1 { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: var(--cy); margin-bottom: 11px; display: flex; align-items: center; gap: 7px; }
    #hud h1 .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--grn);
      box-shadow: 0 0 8px var(--grn); animation: hud-pulse 1.8s ease-in-out infinite; }
    @keyframes hud-pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    #hud .phaserow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    #hud .k { color: var(--muted); font-size: 11.5px; }
    #hud .phase { color: var(--grn); font-weight: 700; font-size: 12px; text-align: right; }

    #hud .cap { color: var(--muted); font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 7px; }
    #hud .queues { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    #hud .q { display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
      background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; }
    #hud .q .ql { color: var(--cy); font-size: 11px; font-weight: 700; }
    #hud .q .qv { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }

    #hud .totalrow { display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid var(--line); padding-top: 9px; }
    #hud .totalrow span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;
    background:#0b0d10;color:#7dd3fc;font:600 14px ui-monospace,monospace;letter-spacing:.08em">
    ● loading R.E.L.A.Y. junction…</div>
  <div id="hud">
    <h1><span class="dot"></span>R.E.L.A.Y · junction</h1>
    <div class="phaserow"><span class="k">signal phase</span><span id="h-phase" class="phase">—</span></div>
    <div class="cap">approach demand · vehicles on approach</div>
    <div class="queues">
      <div class="q"><span class="ql">N</span><span id="h-N" class="qv">0</span></div>
      <div class="q"><span class="ql">S</span><span id="h-S" class="qv">0</span></div>
      <div class="q"><span class="ql">E</span><span id="h-E" class="qv">0</span></div>
      <div class="q"><span class="ql">W</span><span id="h-W" class="qv">0</span></div>
    </div>
    <div class="totalrow"><span class="k">vehicles in view</span><span id="h-total">0</span></div>
  </div>

  <script>
  // no explicit mode in the URL? if the R.E.L.A.Y. server is up, upgrade to the live closed loop —
  // the demo must never accidentally show the offline fallback as "the system".
  (() => {
    const q = new URLSearchParams(location.search);
    if (q.has('live') || q.has('embed') || q.has('capture') || q.has('lockfixed')) return;
    const ctl = new AbortController();
    setTimeout(() => ctl.abort(), 400);
    fetch('/metrics', { signal: ctl.signal }).then(r => {
      if (r.ok) { q.set('live', '1'); location.replace(location.pathname + '?' + q); }
    }).catch(() => {});
  })();
  </script>
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/jsm/"
  } }
  </script>
  <!-- three.js vendored (r160): the demo must survive a venue with no wifi — zero CDN dependency -->
  <script type="module" src="./main.js?v=26"></script>   <!-- bump on release: browsers pin module scripts hard -->
</body>
</html>
